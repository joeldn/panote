# Non-secret settings for dev (src/settings.ts). Run `pulumi stack init dev`
# once against the state bucket and commit the encryptionsalt it adds here.
config:
  panote-infra:accountId: 12e2809e05de8a2bf20b815fd394ec9a
  panote-infra:zone: panote.dev
  panote-infra:bucket: pano-content-dev
  panote-infra:uploadsQueue: pano-uploads-dev
  panote-infra:deadLetterQueue: pano-uploads-dlq-dev
  panote-infra:corsFile: cors.json
  panote-infra:cacheRulesFile: cache-rules.dev.json
  panote-infra:noindexAllResponses: true
  panote-infra:wwwRedirect: false
  # Auth0 (src/auth0.ts): nothing is declared until the import names the
  # tenant here with `auth0:domain` (infra/README.md, step 13).
  panote-infra:auth0LocalDevCallbacks: true
  # GitHub (src/github.ts): nothing is declared until the import names the
  # owner here with `github:owner` (infra/README.md, step 19). Dev owns the
  # repository-wide settings; each stack owns its own Environment.
  panote-infra:githubRepository: panote
  panote-infra:githubRepositoryWide: true
  panote-infra:githubInfraPreviewReviewer: joeldn
  panote-infra:devAutoDeploy: true
